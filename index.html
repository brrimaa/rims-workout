<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rim’s workout</title>
<style>
:root{--bg:#f7f3f6;--card:#fff;--ink:#2a2230;--mute:#756b7c;--line:#e6dde9;--acc:#6b3fa0;--accsoft:#eee5f7;--easy:#2f8f5b;--ok:#2d6fb5;--hard:#c2562f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17131b;--card:#221c28;--ink:#f1ebf5;--mute:#a79cb0;--line:#382f41;--acc:#b891ec;--accsoft:#33284a;--easy:#5fcf95;--ok:#7fb4f0;--hard:#f0865d}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 16px;font-family:system-ui,sans-serif;font-size:14px}
nav{display:flex;gap:6px;margin-bottom:16px;font-family:system-ui,sans-serif}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 14px system-ui,sans-serif;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;font-family:system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font:700 18px Georgia,serif}
.meta{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:8px;margin:10px 0}
.row label{font-size:14px;color:var(--mute)}
input[type=number]{width:90px;padding:8px;font-size:17px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.rate{display:flex;gap:6px}
.rate button{flex:1;padding:10px 2px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px system-ui,sans-serif;cursor:pointer}
.rate button.on[data-r=easy]{border-color:var(--easy);color:var(--easy)}
.rate button.on[data-r=ok]{border-color:var(--ok);color:var(--ok)}
.rate button.on[data-r=hard]{border-color:var(--hard);color:var(--hard)}
.rec{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accsoft);font-size:14px}
.save{margin-top:10px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer}
.last{font-size:12.5px;color:var(--mute);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;font-family:system-ui,sans-serif}
.card h2{font:700 19px Georgia,serif;margin:0 0 6px}
.bar{height:14px;border-radius:7px;background:var(--accsoft);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.foods button{text-align:left;padding:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:14px system-ui,sans-serif;cursor:pointer}
.foods small{display:block;color:var(--mute);font-size:12px}
.link{background:none;border:0;color:var(--acc);font:600 13px system-ui,sans-serif;cursor:pointer;padding:6px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Rim’s workout</h1>
<p class="sub">3 days a week · alternate A, B, A then B, A, B</p>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script>
var WORKOUTS={
A:[
{n:"Goblet squat",s:"3 × 10–12",w:8,step:2},
{n:"Hip thrust",s:"3 × 8–12",w:15,step:2.5},
{n:"Chest press",s:"3 × 8–12",w:4,step:1},
{n:"Lat pulldown",s:"3 × 8–12",w:19,step:2.5},
{n:"Lateral raise",s:"3 × 12–15",w:2,step:0.5},
{n:"Triceps pushdown",s:"2 × 10–12",w:7.7,step:1},
{n:"Ab move (plank or cable crunch)",s:"2 × 30–45 s or 12–15",w:0,step:0}],
B:[
{n:"Romanian deadlift (per hand)",s:"3 × 8–12",w:6,step:1},
{n:"Leg press",s:"3 × 10–12",w:49.9,step:5},
{n:"Shoulder press (per hand)",s:"3 × 8–12",w:3,step:1},
{n:"Seated row",s:"3 × 8–12",w:15,step:2.5},
{n:"Face pull",s:"3 × 12–15",w:7,step:1},
{n:"Leg curl",s:"2 × 10–12",w:29.5,step:2.5},
{n:"Bicep curl",s:"2 × 10–12",w:5,step:1}]
};
var FOODS=[
{n:"Chicken breast, 100 g",p:31,f:0},
{n:"Tuna, 1 can",p:25,f:0},
{n:"Lentils, 1 cup cooked",p:18,f:15},
{n:"Edamame, 1 cup",p:18,f:8},
{n:"Black beans, 1 cup",p:15,f:15},
{n:"Chickpeas, 1 cup",p:15,f:12},
{n:"Greek yogurt, 170 g",p:17,f:0},
{n:"Cottage cheese, 100 g",p:11,f:0},
{n:"2 eggs",p:12,f:0},
{n:"Tofu, 100 g",p:10,f:1},
{n:"Protein powder, 1 scoop",p:22,f:0},
{n:"Almonds, 30 g",p:6,f:3.5},
{n:"Oats, 40 g",p:5,f:4},
{n:"Chia seeds, 2 tbsp",p:4,f:10}
];
var GOAL_P=90,GOAL_F=25;
var S={logs:{},draft:{},weights:{},food:{}};
try{var raw=localStorage.getItem("rimw");if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem("rimw",JSON.stringify(S));}catch(e){}}
var tab="A";
var $=function(id){return document.getElementById(id)};
function today(){return new Date().toISOString().slice(0,10)}
function fmt(x){return (Math.round(x*10)/10).toString()}

function rec(ex,rating){
  var logs=S.logs[ex.n]||[];
  var prev=logs.length?logs[logs.length-1].rating:null;
  var w=S.weights[ex.n]!=null?S.weights[ex.n]:ex.w;
  if(ex.step===0){
    if(rating==="easy")return "Make it harder: hold the plank longer or add reps next time.";
    if(rating==="hard")return "Good effort. Keep the same time and focus on clean form.";
    return "Keep it here until you finish every set comfortably, then add a few seconds or reps.";
  }
  if(rating==="easy")return "Too light. Next time go up to "+fmt(w+ex.step)+" kg (+"+fmt(ex.step)+" kg).";
  if(rating==="hard"){
    if(prev==="hard")return "Hard twice in a row. Drop to about "+fmt(Math.max(0,w-ex.step))+" kg for a session and rebuild with clean reps.";
    return "Stay at "+fmt(w)+" kg. If form broke down or you missed reps, drop "+fmt(ex.step)+" kg next time.";
  }
  return "Right weight. Stay at "+fmt(w)+" kg until you hit the top of the rep range on every set, then go up "+fmt(ex.step)+" kg.";
}

function renderWorkout(k){
  var h="";
  WORKOUTS[k].forEach(function(ex,i){
    var w=S.weights[ex.n]!=null?S.weights[ex.n]:ex.w;
    var d=S.draft[ex.n]||"";
    var logs=S.logs[ex.n]||[];
    var l=logs.length?logs[logs.length-1]:null;
    h+='<div class="ex"><div class="top"><span class="name">'+ex.n+'</span><span class="meta">'+ex.s+'</span></div>';
    h+='<div class="row"><label for="w'+i+'">Weight (kg)</label><input type="number" inputmode="decimal" step="0.1" min="0" id="w'+i+'" value="'+w+'" data-ex="'+i+'"></div>';
    h+='<div class="rate" role="group" aria-label="How did it feel?">';
    [["easy","Easy"],["ok","Just right"],["hard","Hard"]].forEach(function(r){
      h+='<button data-ex="'+i+'" data-r="'+r[0]+'" class="'+(d===r[0]?"on":"")+'">'+r[1]+'</button>';
    });
    h+='</div>';
    if(d)h+='<div class="rec">'+rec(ex,d)+'</div>';
    h+='<button class="save" data-save="'+i+'">Save this exercise</button>';
    if(l)h+='<div class="last">Last saved '+l.date+': '+fmt(l.weight)+' kg, felt '+(l.rating==="ok"?"just right":l.rating)+' ('+logs.length+' sessions logged)</div>';
    h+='</div>';
  });
  return h;
}

function renderFood(){
  var t=S.food.date===today()?S.food:{date:today(),p:0,f:0};
  var pp=Math.min(100,t.p/GOAL_P*100),fp=Math.min(100,t.f/GOAL_F*100);
  var h='<div class="card"><h2>Your daily targets</h2>';
  h+='<p style="margin:4px 0">Protein: <b>80–100 g</b> a day (about 1.6–2 g per kg of body weight).<br>Fiber: <b>25–30 g</b> a day.</p></div>';
  h+='<div class="card"><h2>Today</h2>';
  h+='Protein: <b>'+fmt(t.p)+'</b> / '+GOAL_P+' g<div class="bar"><i style="width:'+pp+'%"></i></div>';
  h+='Fiber: <b>'+fmt(t.f)+'</b> / '+GOAL_F+' g<div class="bar"><i style="width:'+fp+'%"></i></div>';
  h+='<button class="link" id="resetFood">Reset today</button></div>';
  h+='<div class="card"><h2>Tap to add</h2><div class="foods">';
  FOODS.forEach(function(f,i){
    h+='<button data-food="'+i+'">'+f.n+'<small>'+f.p+' g protein · '+f.f+' g fiber</small></button>';
  });
  h+='</div></div>';
  h+='<div class="card"><h2>Tips</h2><p style="margin:4px 0">Beans, lentils, edamame and chickpeas give protein and fiber together. Spread protein over 3–4 meals, about 25 g each. Swap the weight gainer for plain protein powder. Keep sweets and chips occasional and have a protein snack ready, like yogurt with fruit.</p></div>';
  return h;
}

function render(){
  $("nav").innerHTML=[["A","Workout A"],["B","Workout B"],["F","Protein & fiber"]].map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+'</button>';
  }).join("");
  $("view").innerHTML=tab==="F"?renderFood():renderWorkout(tab);
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return}
  if(b.dataset.r){
    var ex=WORKOUTS[tab][+b.dataset.ex];
    S.draft[ex.n]=b.dataset.r;save();render();return}
  if(b.dataset.save!=null){
    var ex=WORKOUTS[tab][+b.dataset.save];
    var inp=$("w"+b.dataset.save);
    var w=parseFloat(inp.value);if(isNaN(w))w=0;
    var d=S.draft[ex.n];
    if(!d){alert("Tap Easy, Just right or Hard first.");return}
    var msg=rec(ex,d);
    S.logs[ex.n]=(S.logs[ex.n]||[]).concat([{date:today(),weight:w,rating:d}]);
    S.weights[ex.n]=d==="easy"&&ex.step?w+ex.step:w;
    delete S.draft[ex.n];save();render();
    return}
  if(b.dataset.food!=null){
    var f=FOODS[+b.dataset.food];
    if(S.food.date!==today())S.food={date:today(),p:0,f:0};
    S.food.p+=f.p;S.food.f+=f.f;save();render();return}
  if(b.id==="resetFood"){S.food={date:today(),p:0,f:0};save();render()}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches("input[type=number]")){
    var ex=WORKOUTS[tab][+t.dataset.ex];
    var w=parseFloat(t.value);
    if(!isNaN(w)){S.weights[ex.n]=w;save();var r=document.querySelector('.rec');}
  }
});
render();
</script>
</body>
</html>
